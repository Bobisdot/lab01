<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Catalog</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<h1>Book Catalog</h1>

<!-- Кітап сәтті сақталғанда шығатын жасыл хабарлама -->
<div class="alert" th:if="${message}" th:text="${message}" style="background-color: #d4edda; color: #155724; padding: 10px; margin-bottom: 15px;"></div>

<p>
    <a th:href="@{/books/new}">+ Add New Book</a>
</p>

<table border="1" cellpadding="8" cellspacing="0" th:if="${!books.isEmpty()}">
    <thead>
    <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Year</th>
        <th>Genre</th>
        <th>Available</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="b : ${books}">
        <td th:text="${b.title}">Title</td>
        <td th:text="${b.author}">Author</td>
        <td th:text="${b.year}">Year</td>
        <td th:text="${b.genre}">Genre</td>
        <td th:text="${b.available ? 'Yes' : 'No'}">Yes</td>
    </tr>
    </tbody>
</table>

<p th:if="${books.isEmpty()}">No books in catalog yet.</p>

</body>
</html>
